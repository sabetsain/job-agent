[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Deterministic-first autonomous job-hunting and application co-pilot"
readme = "docs/INTENT.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "mutmut>=2.4",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
also_copy = ["config/"]
source_paths = ["src/job_agent/"]
only_mutate = [
    "src/job_agent/schemas/*.py",
    "src/job_agent/filters/*.py",
    "src/job_agent/sources/normalize.py",
    "src/job_agent/storage/*.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
