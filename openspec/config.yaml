schema: spec-driven

context: |
  Project: Autonomous Job-Hunting & Application Co-Pilot (job-agent)
  Intent Source of Truth: docs/INTENT.md (living document — surface and resolve any conflicts between specs and docs/INTENT.md with the user).
  Language & Runtime: Python 3.11+, stateless workers designed for local execution first and clean migration to GCP (Cloud Run + Cloud Scheduler + Cloud SQL Postgres).
  Core Principles:
  - Deterministic First: Standard Python for scheduling, ingestion, rule-based pre-filtering, deterministic auditing, Typst compilation, and API routing. Reserve LangGraph strictly for stateful reasoning, document tailoring/auditing, and HITL ideation/revisions.
  - Zero Hallucination & Smart Transferability: Tailored CVs and cover letters must trace every fact, metric, title, date, and skill to Master_Profile (or user-verified session facts). Surface related/transferable experience where relevant, and flag only major unaddressed gaps alongside the drafts rather than noisy minor omissions.
  - Interactive Co-Pilot Handoff: Prepare tailored PDFs, fit breakdown, major gaps, and direct apply link; user submits manually (no fragile auto-clicking or CAPTCHA/bot scraping).
  - Hybrid Storage: YAML/JSON for Master_Profile, Job_Preferences, LLMConfig, and sources.yaml; SQLite locally (migrating to Cloud SQL Postgres on GCP) for application state, profile update suggestions cache, and LangGraph checkpoints; Google Sheets as synced Application_Tracker view; Slack PDF delivery serves as final document storage (no Google Drive required). Prune jobs ingested > 6 months ago unless status is Interviewing.
  - Bilingual Support (da/en): Target market is Copenhagen, Denmark (EU) + Remote. Job postings may be in Danish or English; detect language and generate matching Danish or English CVs and cover letters with UTF-8 Danish character support (æ, ø, å).
  - Seniority, Freshness & Daily Draft Cap: Primarily targeting entry-level roles. Hard-reject Senior/Staff/Principal/Lead+ roles (keep Architect eligible, e.g., Solutions Architect) and automatically score out non-technical roles. Entry-level roles (0-1 yrs) allow transferable skills (1.0 credit) at >= 65% minimum fit; stretch roles (~2 yrs) require exact must-have matches (0.0 transferable credit) at >= 95% minimum fit. Discard postings older than ~2-3 weeks (default 21 days) without storing them unless an explicit future application deadline is present. Score all eligible jobs into a priority FIFO draft queue, and cap application drafting to AT MOST 3 per day (a cap, never a quota) — prioritizing un-drafted/un-applied roles posted within 7 days or with an active future application deadline, and falling back to older eligible roles only when none remain in the preferred window. Compensation is ignored.
  - Design-Preserving Layout & Dedicated Prompts: Single-column ATS-friendly Typst templates via typst-py (open-source basic-resume CV + custom matching Cover Letter). Page tightening must happen via content editing/pruning, never by shrinking body font below 9pt or exceeding 12pt (body text only) or cramping whitespace/margins. Dedicated startup-loaded system prompts under src/job_agent/prompts/ embed application-voice (Writer) and blader/humanizer (Auditor).
  - Testing Standards: Thorough intent-rooted test suite grounded in specs and docs/INTENT.md, curated scoring evals suite, and mutation testing (mutmut) so behavioral changes to targeted code cause tests to fail.
  - Discovery Strategy: Once-daily scheduled pass over free & open discovery board APIs/RSS (Arbeitnow, Remotive, Himalayas, Jobicy, Jobindex RSS) + Manual Drop, behind a JobSource adapter interface. Internal canonical job_id only (no separate fuzzy deduplication subsystem).
  - HITL Interface: Slack Bot (channels separated by function, thread-per-job bound to LangGraph thread_id) + local CLI review harness. Threads support open ideation without forcing regeneration on every message; re-iteration runs only on explicit instruction (one-shot ideation -> re-iterate), and the workflow finishes only on explicit approval/dismissal. On interview invite emails, message the user in Slack with the exact submitted CV and cover letter PDFs alongside syncing the calendar event.
  - LLM Provider: OpenCode Go via langchain_openai.ChatOpenAI (https://opencode.ai/zen/go/v1), dual-tier routing (free scoring_model for scoring/classification, cheap paid reasoning_model for planning/writing/auditing/ideation).
