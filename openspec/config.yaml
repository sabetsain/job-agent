schema: spec-driven

context: |
  Project: Autonomous Job-Hunting & Application Co-Pilot (job-agent)
  Intent Source of Truth: docs/INTENT.md (living document — surface and resolve any conflicts between specs and docs/INTENT.md with the user).
  Language & Runtime: Python 3.11+, stateless workers designed for local execution first and clean migration to GCP (Cloud Run + Cloud Scheduler + Cloud SQL Postgres).
  Core Principles:
  - Deterministic First: Standard Python for scheduling, ingestion, rule-based pre-filtering, LaTeX compilation, and API routing. Reserve LangGraph strictly for stateful reasoning, document tailoring/auditing, and HITL ideation/revisions.
  - Zero Hallucination & Smart Transferability: Tailored CVs and cover letters must trace every fact, metric, title, date, and skill to Master_Profile. Surface related/transferable experience where relevant (e.g., Pulumi IaC when Terraform is requested), and flag only major unaddressed gaps alongside the drafts rather than noisy minor omissions.
  - Interactive Co-Pilot Handoff: Prepare tailored PDFs, fit breakdown, major gaps, and direct apply link; user submits manually (no fragile auto-clicking or CAPTCHA/bot scraping).
  - Hybrid Storage: YAML/JSON for Master_Profile, Job_Preferences, and sources.yaml; SQLite locally (migrating to Cloud SQL Postgres on GCP) for application state and LangGraph checkpoints; Google Sheets as synced Application_Tracker view; Slack PDF delivery serves as final document storage (no Google Drive required). Prune jobs ingested > 6 months ago unless status is Interviewing.
  - Bilingual Support (da/en): Target market is Copenhagen, Denmark (EU) + Remote. Job postings may be in Danish or English; detect language and generate matching Danish or English CVs and cover letters with UTF-8 Danish character support (æ, ø, å).
  - Seniority, Freshness & Daily Draft Cap: Primarily targeting entry-level roles. Hard-reject Senior/Staff/Principal/Lead+ roles (keep Architect eligible, e.g., Solutions Architect). Entry-level roles (0-1 yrs) allow slightly lenient must-have skill coverage; stretch roles (~2 yrs) are eligible if and only if must-have skill coverage is maximized. Discard postings older than ~2-3 weeks (default 21 days) without storing them unless an explicit future application deadline is present. Evaluate all eligible jobs, and cap application drafting to AT MOST 3 per day (a cap, never a quota) — prioritizing un-drafted/un-applied roles posted within 7 days or with an active future application deadline, and falling back to older eligible roles only when none remain in the preferred window. Compensation is ignored.
  - Design-Preserving Layout & Voice: Single-column ATS-friendly LaTeX templates. Page tightening must happen via content editing/pruning, never by shrinking font below 9pt or cramping whitespace/margins. The writer agent MUST use the `/application-voice` skill (`.agent/skills/application-voice`) to guide cover letter and CV tone.
  - Testing Standards: Thorough intent-rooted test suite grounded in specs and docs/INTENT.md, verified with mutation testing so behavioral changes to targeted code cause tests to fail.
  - Discovery Strategy: Once-daily scheduled pass over free & open discovery board APIs/RSS (Arbeitnow, Remotive, Himalayas, Jobicy, Jobindex RSS) + Manual Drop, behind a JobSource adapter interface. Internal canonical job_id only (no separate fuzzy deduplication subsystem).
  - HITL Interface: Slack Bot (dedicated channel, thread-per-job bound to LangGraph thread_id). Threads support open ideation without forcing regeneration on every message; re-iteration runs only on explicit instruction, and the workflow finishes only on explicit approval/dismissal. On interview invite emails, message the user in Slack with the exact submitted CV and cover letter PDFs alongside syncing the calendar event.
  - LLM Provider: OpenCode Go via langchain_openai.ChatOpenAI (/inference/go/openai), dual models (fast model for scoring/classification, reasoning model for tailoring/auditing).
